[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    smoke: pruebas de humo (flujos basicos criticos)
    login: pruebas relacionadas con el login
    catalog: pruebas de catalogo / inventario
    cart: pruebas de carrito
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
